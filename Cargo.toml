[package]
name = "milkyapps-core"
authors = ["Daniel Frederico Lins Leite"]
version = "0.1.0"
edition = "2024"

[dependencies]
paste = "1"
memmap2 = "0.9.11"

[dev-dependencies]
micromeasure = "0.6"
loom = "0.7"
libtest-mimic = "0.8"
insta = { version = "1", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"

[lints.rust]
# `loom` is enabled via `--cfg loom` (RUSTFLAGS) for the `test-loom` recipe.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.bench]
debug = true

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "hazard_ptrs"
harness = false

[[test]]
name = "main"
path = "tests/main.rs"
harness = false
