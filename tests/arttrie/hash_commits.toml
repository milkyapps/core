[[cmds]]
op = "insert"
key = "0123456789abcdef0123456789abcdef02234567"
value = "step:earlier"

[[cmds]]
op = "insert"
key = "0123456789abcdef0123456789abcdff01234567"
value = "step:early"

[[cmds]]
op = "insert"
key = "0123456789abcdef0123456789ab000001234567"
value = "step:sooner"

